# Use this workspace to collaborate.
# Replace this with the id of a real Postman Cloud workspace before running
# the "Sync Postman workspace" GitHub Action (postman workspace push reads it).
workspace:
  id: REPLACE_WITH_POSTMAN_WORKSPACE_ID

