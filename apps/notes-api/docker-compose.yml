# Runs the pre-built image from GHCR (published by
# .github/workflows/docker-publish.yml on every `vX.Y.Z` tag push) alongside
# a local MongoDB, rather than building the app locally or requiring an
# external database. Env vars are injected from `.env` in this same
# directory (apps/notes-api/) — copy `.env.example` to `.env` first.
services:
  notes-api:
    image: ghcr.io/mykks32/notes-api:latest
    env_file:
      - .env
    environment:
      # Overrides whatever MONGODB_URI is set to in .env: within this
      # compose network the database is reachable at the service name
      # "mongo", never at localhost.
      MONGODB_URI: mongodb://mongo:27017/notes_db
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Web UI for browsing the notes collection at http://localhost:8081 —
  # dev/debugging convenience only, not part of the app itself.
  mongo-express:
    image: mongo-express:1
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: 'false'
    ports:
      - '8081:8081'
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
