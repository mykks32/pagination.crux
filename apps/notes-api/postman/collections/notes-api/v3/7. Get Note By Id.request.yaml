$kind: http-request
name: 7. Get Note By Id
description: Uses {{noteId}}, set by "1. Create Note"'s test script (in either the v1, v2, or v3 folder — same underlying resource either way).
method: GET
url: "{{baseUrlV3}}/notes/:noteId"
pathVariables:
  noteId: 6a6e37606415965f6fef9f27
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('noteId')) {
          pm.environment.set('noteId', '6a66349095dfff6f321e9827');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Get Note By Id responds with 200', function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
examples: ./.resources/7. Get Note By Id.resources/examples
order: 7000
