$kind: http-request
name: 8. Update Note
method: PATCH
url: "{{baseUrlV3}}/notes/:noteId"
headers:
  Content-Type: application/json
pathVariables:
  noteId: 6a6e37606415965f6fef9f27
body:
  type: json
  content: |-
    {
      "title": "My first note (edited)",
      "tags": [
        "personal",
        "edited"
      ]
    }
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('noteId')) {
          pm.environment.set('noteId', '6a66349095dfff6f321e9827');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Update Note responds with 200', function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
    language: text/javascript
examples: ./.resources/8. Update Note.resources/examples
order: 8000
