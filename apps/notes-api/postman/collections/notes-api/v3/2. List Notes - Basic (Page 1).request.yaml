$kind: http-request
name: '2. List Notes - Basic (Page 1)'
description: 'Response always includes `meta.totalItems`/`totalPages` (no opt-in flag needed, unlike v1/v2''s `includeTotalCount`) and `links.first`/`last` for jump-to-any-page navigation.'
method: GET
url: '{{baseUrlV3}}/notes?page=1&limit=10'
queryParams:
  - key: page
    value: '1'
  - key: limit
    value: '10'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      if (body && body.links) {
          pm.environment.set('v3PreviousLink', body.links.previous);
          pm.environment.set('v3LastLink', body.links.last);
      }

      pm.test('List Notes - Basic responds with 200', function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
examples: ./.resources/2. List Notes - Basic (Page 1).resources/examples
order: 2000
