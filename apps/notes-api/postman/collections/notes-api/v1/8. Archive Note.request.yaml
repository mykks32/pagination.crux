$kind: http-request
name: '8. Archive Note'
description: 'Toggling `archived` is done through the same PATCH endpoint as any other field update — there''s no separate archive endpoint.'
method: PATCH
url: '{{baseUrl}}/notes/{{noteId}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "archived": true
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.environment.get('noteId')) {
          pm.environment.set('noteId', '6a66349095dfff6f321e9827');
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Archive Note responds with 200', function () {
          pm.expect(pm.response.code).to.be.oneOf([200]);
      });
examples: ./.resources/8. Archive Note.resources/examples
order: 8000
