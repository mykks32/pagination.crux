name: Publish notes-api image

# Builds and pushes on every version tag (v1.2.3), so the image tag always
# traces back to an actual release rather than a floating branch head.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN already has `packages: write` (granted above) scoped to
      # this repo's own GHCR namespace — no extra PAT/secret needed.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Turns the pushed tag (e.g. v1.4.2) into the actual image tags:
      # "1.4.2", "1.4" (rolling minor), and "latest".
      - name: Derive image tags from the git tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/notes-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Build context is the repo root (not apps/notes-api) because the
      # Dockerfile needs the sibling packages/pagination workspace package
      # too — see the comment at the top of apps/notes-api/Dockerfile.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/notes-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
